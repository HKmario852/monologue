name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # The key that signed every published release, stored by scripts/setup-release-signing.ps1.
      # Pull requests (and forks) have no secrets and only run tests and lint.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MONOLOGUE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "MONOLOGUE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Release build
        if: env.MONOLOGUE_KEYSTORE_FILE != ''
        env:
          MONOLOGUE_KEYSTORE_PASSWORD: ${{ secrets.MONOLOGUE_KEYSTORE_PASSWORD }}
          MONOLOGUE_KEY_ALIAS: ${{ secrets.MONOLOGUE_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --console=plain
      # A release APK signed with any other key could never update installed copies or use Google sign-in
      - name: Check the signing certificate
        if: env.MONOLOGUE_KEYSTORE_FILE != ''
        run: |
          expected=$(sed -n 's/^releaseCertSha256=//p' gradle.properties)
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "Signed with $actual"
          [ "$actual" = "$expected" ] || { echo "::error::Release APK is signed with $actual, expected $expected"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: env.MONOLOGUE_KEYSTORE_FILE != ''
        with:
          name: monologue-release-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
